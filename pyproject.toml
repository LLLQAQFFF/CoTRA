[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cotra"
version = "0.1.0"
description = "CoTRA: Contribution-Tracked Risk Auditing for the trajectories of LLM coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "scikit-learn>=1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
